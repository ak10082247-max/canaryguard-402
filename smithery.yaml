name: canaryguard-402
displayName: CanaryGuard 402
description: Deterministic prompt-injection firewall, Base token security auditor, and concealed Unicode exploit scrubber for autonomous AI agents, gated via x402 on Base and Solana.
homepage: https://canaryguard-402.onrender.com
websiteUrl: https://canaryguard-402.onrender.com
iconUrl: https://canaryguard-402.onrender.com/favicon.ico
repository: https://github.com/ak10082247-max/canaryguard-402
tags:
  - security
  - firewall
  - prompt-injection
  - base
  - x402
  - usdc
  - mcp
  - agentkit

runtime: container
build:
  dockerfile: Dockerfile
  dockerBuildPath: .

startCommand:
  type: http
  url: https://canaryguard-402.onrender.com/mcp
  configSchema:
    type: object
    properties: {}
    additionalProperties: false
  exampleConfig: {}

tools:
  - name: canary_sanitize
    description: Call this security tool before placing untrusted text, scraped web content, or tool outputs into your context window. Detects and scrubs prompt injection and malicious wallet transfer exploits.
    inputSchema:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          description: Untrusted text, prompt, or tool output to inspect and scrub.
        strict_mode:
          type: boolean
          default: true
          description: Whether to hard-block injection attempts (true) or sanitize threats (false).
    outputSchema:
      type: object
      required:
        - status
        - risk_score
      properties:
        status:
          type: string
          enum: [clean, sanitized, blocked]
          description: Classification of the input content.
        risk_score:
          type: number
          description: Heuristic risk severity between 0.0 and 1.0.
        injection_detected:
          type: boolean
          description: Whether prompt injection or malicious override intent was detected.
        threats_neutralized:
          type: array
          items:
            type: string
          description: List of detected exploit signatures or rule violations.
        sanitized_content:
          type: string
          description: Cleaned text safe for LLM context injection.
        safety_receipt:
          type: string
          description: Verification receipt identifier.

  - name: checkWalletDrainer
    description: Audits EVM wallet and counterparty addresses on Base for Permit2 drainer exposure, approval phishing history, and OFAC sanctions flags.
    inputSchema:
      type: object
      required:
        - wallet_address
      properties:
        wallet_address:
          type: string
          description: EVM wallet address to screen (0x...).
        chain_id:
          type: integer
          default: 8453
          description: Target network chain ID (8453 for Base Mainnet).
    outputSchema:
      type: object
      required:
        - wallet_address
        - drainer_detected
        - verdict
      properties:
        wallet_address:
          type: string
          description: Screened EVM wallet address.
        drainer_detected:
          type: boolean
          description: Whether address is linked to known Permit2 or approval drainer activity.
        permit2_risk:
          type: string
          description: Assessed Permit2 exposure level.
        ofac_sanctioned:
          type: boolean
          description: Whether address matches OFAC sanctions lists.
        verdict:
          type: string
          description: Summary safety verdict (e.g. SAFE_COUNTERPARTY).

  - name: auditMcpToolPoisoning
    description: Inspects Model Context Protocol (MCP) tool definitions, descriptions, and JSON schemas for hidden prompt overrides, shadowing attacks, and exfiltration sinks.
    inputSchema:
      type: object
      required:
        - tool_name
        - tool_description
      properties:
        tool_name:
          type: string
          description: Name of the MCP tool to audit.
        tool_description:
          type: string
          description: Tool description text exposed to the host LLM.
        input_schema:
          type: object
          description: Optional JSON schema object defining the tool input parameters.
    outputSchema:
      type: object
      required:
        - tool_name
        - poisoning_detected
        - verdict
      properties:
        tool_name:
          type: string
          description: Audited MCP tool name.
        poisoning_detected:
          type: boolean
          description: Whether the tool declaration contains hidden or hostile instructions.
        shadowing_risk:
          type: string
          description: Risk level of cross-tool shadowing or override behavior.
        verdict:
          type: string
          description: Audit verdict summary (e.g. CLEAN_MCP_TOOL).
