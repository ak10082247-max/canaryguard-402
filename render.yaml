services:
  - type: web
    name: canaryguard-402
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: canary-payment-state
      mountPath: /app/state
      sizeGB: 1
    envVars:
      - key: PAYMENTS_DB_PATH
        value: /app/state/payments.sqlite
      - key: SOLANA_MERCHANT_ADDRESS
        value: 9wuMysgXwNhtQeqJgGByAiMYc4EjzZ5wUSmnjrrt3ffh
      - key: X402_RECIPIENT_ADDRESS
        value: 0x80E0Ae84679b7f11bE171DaADd492FBECf628cd6
      - key: NETWORK
        value: base
      - key: PUBLIC_URL
        value: https://canaryguard-402.onrender.com
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
